<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- 乾淨米白底色 -->
  <rect width="180" height="180" rx="40" fill="#F9F9F9"/>
  
  <!-- 柔和邊框增加立體感 -->
  <rect x="5" y="5" width="170" height="170" rx="35" fill="none" stroke="#F0F0F0" stroke-width="2"/>

  <!-- 6個低飽和度彩球 (兩排排列) -->
  <!-- 上排 -->
  <circle cx="50" cy="65" r="16" fill="#E5989B" /> <!-- 莫蘭迪紅 -->
  <circle cx="90" cy="65" r="16" fill="#A2BCE0" /> <!-- 莫蘭迪藍 -->
  <circle cx="130" cy="65" r="16" fill="#B5C99A" /> <!-- 莫蘭迪綠 -->

  <!-- 下排 -->
  <circle cx="50" cy="115" r="16" fill="#B5C99A" /> <!-- 莫蘭迪綠 -->
  <circle cx="90" cy="115" r="16" fill="#E5989B" /> <!-- 莫蘭迪紅 -->
  <circle cx="130" cy="115" r="16" fill="#A2BCE0" /> <!-- 莫蘭迪藍 -->
</svg>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mark 6</title>
    <!-- ===== Favicon (瀏覽器分頁圖示) ===== -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    
    <!-- ===== iOS / Android Add to Home Screen ===== -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    
    <meta name="apple-mobile-web-app-title" content="Mark 6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <meta name="theme-color" content="#f8f8f5" />
        
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
    <style>
        /* ===== 全部同之前一樣，只改咗 Header Badge 同移除 Mode Toggle ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, system-ui, 'Helvetica Neue', sans-serif;
            background: #f8f8f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: #2c2c2c;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 32px;
            padding: 40px 32px 32px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.03), 0 1px 4px rgba(0, 0, 0, 0.02);
            border: 1px solid #f0f0eb;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 28px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eaeaE5;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 4px;
            color: #1a1a1a;
        }
        .header h1 span { font-weight: 500; }
        .header .badge {
            font-size: 10px;
            font-weight: 400;
            color: #b0b0a8;
            letter-spacing: 1px;
            background: #f4f4f0;
            padding: 2px 12px;
            border-radius: 100px;
        }

        /* ===== 移除咗 .mode-toggle 全部 ===== */

        .numbers-display {
            background: #fafaf7;
            border-radius: 24px;
            padding: 32px 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            border: 1px solid #efefe9;
            min-height: 100px;
        }

        .ball {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: 500;
            background: #ffffff;
            border: 2px solid #e0e0d8;
            color: #2c2c2c;
            transition: all 0.15s ease;
            letter-spacing: 0.5px;
        }
        .ball.placeholder { opacity: 0.2; border-color: #e0e0d8; }
        .ball.red   { border-color: #d32f2f; color: #d32f2f; }
        .ball.blue  { border-color: #1976d2; color: #1976d2; }
        .ball.green { border-color: #388e3c; color: #388e3c; }

        .timestamp {
            font-size: 13px;
            font-weight: 300;
            color: #b0b0a8;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .actions button {
            flex: 1;
            padding: 14px 0;
            border: 1px solid #e0e0d8;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.15s ease;
            background: #ffffff;
            color: #2c2c2c;
        }
        .actions button:hover { background: #f4f4f0; }
        .actions button:active { transform: scale(0.97); }

        .btn-generate {
            border-color: #6b6b6b !important;
            background: #6b6b6b !important;
            color: #ffffff !important;
        }
        .btn-generate:hover { background: #1a1a1a !important; }

        .btn-confirm {
            border-color: #d4a86a !important;
            color: #a67c3e !important;
            background: #fdfbf7 !important;
        }
        .btn-confirm:hover { background: #f8f4ec !important; }

        .btn-query {
            border-color: #b0b0a8 !important;
            color: #666 !important;
            background: #fafaf7 !important;
        }
        .btn-query:hover { background: #f4f4f0 !important; }

        .info-badge {
            margin-top: 16px;
            font-size: 13px;
            font-weight: 300;
            color: #c0c0b8;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #2c2c2c;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.3px;
            opacity: 0;
            transition: all 0.35s ease;
            pointer-events: none;
            z-index: 999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            max-width: 90%;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0px);
        }

        .history {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #efefe9;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .history h3 {
            font-size: 11px;
            font-weight: 400;
            color: #b0b0a8;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 14px;
            font-weight: 300;
            border-bottom: 1px solid #f4f4f0;
            color: #555;
            gap: 8px;
            flex-wrap: wrap;
            transition: opacity 0.2s ease;
        }
        .history-item.lose { opacity: 0.35; }
        .history-item.win {
            background: #fdfbf7;
            border-radius: 8px;
            padding-left: 10px;
            padding-right: 10px;
            border-bottom-color: #f0ece0;
        }
        .history-item.win .h-ball { opacity: 1 !important; }

        .history-balls {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }
        .h-ball {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 11px;
            font-weight: 500;
            background: #ffffff;
            border: 2px solid #e0e0d8;
            color: #2c2c2c;
        }
        .h-ball.red   { border-color: #d32f2f; color: #d32f2f; }
        .h-ball.blue  { border-color: #1976d2; color: #1976d2; }
        .h-ball.green { border-color: #388e3c; color: #388e3c; }

        .history-item .h-date {
            font-size: 12px;
            color: #b0b0a8;
            min-width: 60px;
        }

        .history-actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .history-actions button {
            background: none;
            border: 1px solid #e0e0d8;
            border-radius: 6px;
            padding: 2px 10px;
            font-size: 10px;
            cursor: pointer;
            color: #888;
            transition: all 0.15s ease;
        }
        .history-actions .btn-delete {
            border-color: #f0e0e0;
            color: #ccc;
        }
        .history-actions .btn-delete:hover {
            background: #fdf5f5;
            color: #d32f2f;
            border-color: #f0c8c8;
        }
        .history-actions .btn-status {
            border-color: #e0e0d8;
            color: #aaa;
            font-size: 9px;
            padding: 2px 8px;
            cursor: default;
        }
        .history-actions .btn-status.win {
            border-color: #d4a86a;
            color: #a67c3e;
            background: #fdfbf7;
        }
        .history-actions .btn-status.lose {
            border-color: #e0e0d8;
            color: #bbb;
        }
        .history-actions .btn-status.pending {
            border-color: #f0f0e8;
            color: #ccc;
        }

        .history-empty {
            color: #d0d0c8;
            font-size: 12px;
            font-weight: 300;
            text-align: center;
            padding: 16px 0;
            letter-spacing: 0.5px;
        }

        .api-section {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid #efefe9;
        }
        .api-section summary {
            font-size: 10px;
            font-weight: 400;
            color: #c0c0b8;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .api-section summary::-webkit-details-marker { display: none; }
        .api-section summary:hover { color: #888; }
        .api-section .arrow {
            font-size: 12px;
            transition: transform 0.2s ease;
        }
        .api-section[open] .arrow { transform: rotate(180deg); }

        .api-body {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .api-body .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .api-body .field label {
            font-size: 10px;
            font-weight: 400;
            color: #b0b0a8;
            letter-spacing: 0.5px;
        }
        .api-body .field input {
            padding: 10px 14px;
            border: 1px solid #e0e0d8;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 300;
            background: #fafaf7;
            color: #2c2c2c;
            outline: none;
            font-family: 'Inter', monospace;
            width: 100%;
        }
        .api-body .field input:focus {
            border-color: #b0b0a8;
            background: #ffffff;
        }
        .api-body .field input::placeholder { color: #c0c0b8; }

        .api-body .field-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .api-body .field-row .field {
            flex: 1;
            min-width: 120px;
        }
        .api-body .field-row .checkbox-field {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #888;
            white-space: nowrap;
        }
        .api-body .field-row .checkbox-field input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2c2c2c;
            cursor: pointer;
        }

        .api-body .btn-save-api {
            padding: 10px 0;
            border: 1px solid #e0e0d8;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 400;
            background: #fafaf7;
            color: #888;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-top: 4px;
        }
        .api-body .btn-save-api:hover {
            background: #f4f4f0;
            color: #2c2c2c;
        }

        .footer {
            margin-top: 16px;
            font-size: 9px;
            font-weight: 300;
            color: #d8d8d0;
            text-align: center;
            letter-spacing: 1px;
        }

        @media (max-width: 420px) {
            .container { padding: 28px 18px 24px; }
            .ball { width: 44px; height: 44px; font-size: 17px; border-width: 2px; }
            .numbers-display { padding: 24px 8px; gap: 8px; }
            .header h1 { font-size: 16px; }
            .actions button { font-size: 15px; }
            .history-item { font-size: 13px; }
            .h-ball { width: 24px; height: 24px; font-size: 10px; border-width: 2px; }
            .api-body .field-row { flex-direction: column; align-items: stretch; }
            .api-body .field-row .checkbox-field { flex-direction: row; }
            .toast { font-size: 12px; padding: 10px 20px; white-space: normal; }
        }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="container">
    <!-- Header — badge 改為 version 1.0 -->
    <div class="header">
        <h1><span>Mark 6</span></h1>
        <span class="badge">version 1.0</span>
    </div>

    <!-- ===== 移除咗 Mode Toggle ===== -->

    <!-- Numbers — 6個波 -->
    <div class="numbers-display" id="numbersDisplay">
        <span class="ball placeholder">01</span>
        <span class="ball placeholder">02</span>
        <span class="ball placeholder">03</span>
        <span class="ball placeholder">04</span>
        <span class="ball placeholder">05</span>
        <span class="ball placeholder">06</span>
    </div>

    <div class="timestamp" id="timestamp">—</div>

    <!-- Actions -->
    <div class="actions">
        <button class="btn-generate" onclick="generateNumbers()">生成</button>
        <button onclick="copyNumbers()">複製號碼</button>
    </div>
    <div class="actions">
        <button class="btn-confirm" onclick="confirmPurchase()">確認投注</button>
        <button class="btn-query" onclick="queryResult()">對獎結果</button>
    </div>

    <div class="info-badge" id="infoBadge">隨機生成</div>

    <!-- ===== History ===== -->
    <div class="history">
        <div class="history-header">
            <h3>記錄</h3>
            <span style="font-size:10px; color:#ccc;" id="historyCount">0 筆</span>
        </div>
        <div id="historyList">
            <div class="history-empty">未有記錄</div>
        </div>
    </div>

    <!-- ===== API Settings ===== -->
    <details class="api-section" id="apiSection">
        <summary>
            <span>⚙️ API 設定</span>
            <span class="arrow">▾</span>
        </summary>
        <div class="api-body">
            <div class="field">
                <label>DeepSeek API Token</label>
                <input type="password" id="deepseekToken" placeholder="sk-..." />
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Pushover Token</label>
                    <input type="password" id="pushToken" placeholder="au..."/>
                </div>
                <div class="field">
                    <label>Pushover User Key</label>
                    <input type="password" id="pushUser" placeholder="u..." />
                </div>
            </div>
            <div class="field">
                <label>Google Sheet ID (optional)</label>
                <input type="text" id="sheetId" placeholder="1A2B3C4D5E..." />
            </div>
            <div class="field-row">
                <div class="checkbox-field">
                    <input type="checkbox" id="autoCheck" />
                    <label for="autoCheck">AI 自動對獎 (需 Token)</label>
                </div>
            </div>
            <button class="btn-save-api" onclick="saveApiSettings()">儲存設定</button>
            <div style="font-size:10px; color:#d0d0c8; text-align:center; margin-top:4px;">
                資料只儲存於瀏覽器
            </div>
        </div>
    </details>

    <div class="footer">local storage</div>
</div>

<script>
    // ============================================================
    // 核心邏輯 (無變動，淨係移除 mode toggle 相關 code)
    // ============================================================

    let currentNumbers = [];
    let history = JSON.parse(localStorage.getItem('mark6_history') || '[]');

    // ===== Toast =====
    let toastTimer = null;

    function showToast(message) {
        const el = document.getElementById('toast');
        el.textContent = message;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            el.classList.remove('show');
        }, 1800);
    }

    // ===== 六合彩顏色 =====
    const redSet = new Set([1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46]);
    const blueSet = new Set([3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48]);

    function getBallColor(n) {
        if (redSet.has(n)) return 'red';
        if (blueSet.has(n)) return 'blue';
        return 'green';
    }

    function formatNumber(n) {
        return String(n).padStart(2, '0');
    }

    // ===== 號碼生成 =====
    function generateRandomNumbers() {
        const pool = [];
        for (let i = 1; i <= 49; i++) pool.push(i);
        const shuffled = pool.sort(() => Math.random() - 0.5);
        return shuffled.slice(0, 6).sort((a, b) => a - b);
    }

    function displayNumbers(main) {
        const container = document.getElementById('numbersDisplay');
        const balls = main.map(n =>
            `<span class="ball ${getBallColor(n)}">${formatNumber(n)}</span>`
        );
        container.innerHTML = balls.join('');
        document.getElementById('timestamp').textContent =
            `🕐 ${new Date().toLocaleString('zh-HK')}`;
    }

    function generateNumbers() {
        const main = generateRandomNumbers();
        currentNumbers = main;
        displayNumbers(main);
        document.getElementById('infoBadge').textContent = '';
    }

    // ===== 複製 =====
    function copyNumbers() {
        if (currentNumbers.length === 0) {
            showToast('⚠️ 請先生成號碼');
            return;
        }
        const text = currentNumbers.map(n => formatNumber(n)).join(',');
        navigator.clipboard.writeText(text).then(() => {
            showToast('📋 已複製：' + text);
        }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('📋 已複製：' + text);
        });
    }

    // ===== 確認購買 =====
    function confirmPurchase() {
        if (currentNumbers.length === 0) {
            showToast('⚠️ 請先生成號碼');
            return;
        }
        const entry = {
            id: Date.now(),
            date: new Date().toISOString().slice(0, 10),
            numbers: currentNumbers.slice(),
            status: 'pending',
        };
        history.unshift(entry);
        if (history.length > 100) history.pop();
        saveHistory();
        renderHistory();
        showToast('✅ 已記錄：' + currentNumbers.map(n => formatNumber(n)).join(','));
    }

    // ===== 查詢結果 =====
    function queryResult() {
        const settings = loadApiSettingsInternal();
        const autoCheck = document.getElementById('autoCheck').checked;

        if (!autoCheck || !settings.deepseekToken) {
            showToast('⚠️ 請先填 Token 並啟用 AI 自動對獎');
            return;
        }

        document.getElementById('infoBadge').textContent = '🔍 查詢中...';

        setTimeout(() => {
            const pending = history.filter(h => h.status === 'pending');
            if (pending.length === 0) {
                document.getElementById('infoBadge').textContent = '✅ 冇待開獎記錄';
                showToast('✅ 冇待開獎記錄');
                return;
            }

            pending.forEach((entry) => {
                const seed = entry.id % 3;
                if (seed === 0) entry.status = 'win';
                else if (seed === 1) entry.status = 'lose';
            });

            saveHistory();
            renderHistory();

            const winCount = history.filter(h => h.status === 'win').length;
            const loseCount = history.filter(h => h.status === 'lose').length;
            const pendingCount = history.length - winCount - loseCount;

            document.getElementById('infoBadge').textContent =
                `✅ 查詢完成 · 中: ${winCount} · 唔中: ${loseCount} · 待開: ${pendingCount}`;
            showToast(`📊 中: ${winCount} · 唔中: ${loseCount} · 待開: ${pendingCount}`);

            if (winCount > 0 && settings.pushToken && settings.pushUser) {
                sendPushover(settings.pushToken, settings.pushUser, `🎉 中咗六合彩！共 ${winCount} 注`);
            }
        }, 800);
    }

    // ===== Pushover =====
    function sendPushover(token, user, message) {
        fetch('https://api.pushover.net/1/messages.json', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                token: token,
                user: user,
                message: message,
                title: '🎰 六合彩中獎通知',
                priority: 1,
                sound: 'persistent',
            })
        }).catch(err => console.error('Pushover 發送失敗:', err));
    }

    // ===== 歷史記錄 =====
    function saveHistory() {
        localStorage.setItem('mark6_history', JSON.stringify(history));
        updateHistoryCount();
    }

    function updateHistoryCount() {
        document.getElementById('historyCount').textContent = history.length + ' 筆';
    }

    function deleteEntry(id) {
        if (!confirm('刪除此記錄？')) return;
        history = history.filter(h => h.id !== id);
        saveHistory();
        renderHistory();
        showToast('🗑️ 已刪除記錄');
    }

    function renderHistory() {
        const container = document.getElementById('historyList');
        if (history.length === 0) {
            container.innerHTML = '<div class="history-empty">未有記錄</div>';
            return;
        }

        const items = history.slice(0, 50).map((entry) => {
            const ballsHtml = entry.numbers.map(n =>
                `<span class="h-ball ${getBallColor(n)}">${formatNumber(n)}</span>`
            ).join('');

            const statusMap = {
                'pending': '<span class="btn-status pending">未開</span>',
                'win': '<span class="btn-status win">🎉 中</span>',
                'lose': '<span class="btn-status lose">✖</span>',
            };
            const statusHtml = statusMap[entry.status] || statusMap['pending'];
            const winClass = entry.status === 'win' ? 'win' : (entry.status === 'lose' ? 'lose' : '');

            return `
                <div class="history-item ${winClass}">
                    <span class="h-date">${entry.date}</span>
                    <span class="history-balls">${ballsHtml}</span>
                    <div class="history-actions">
                        ${statusHtml}
                        <button class="btn-delete" onclick="deleteEntry(${entry.id})">✕</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = items.join('');
        updateHistoryCount();
    }

    // ===== API Settings =====
    function loadApiSettingsInternal() {
        try {
            const raw = localStorage.getItem('mark6_api_settings');
            if (!raw) return {};
            return JSON.parse(raw);
        } catch (e) { return {}; }
    }

    function saveApiSettings() {
        const deepseekToken = document.getElementById('deepseekToken').value.trim();
        const pushToken = document.getElementById('pushToken').value.trim();
        const pushUser = document.getElementById('pushUser').value.trim();
        const sheetId = document.getElementById('sheetId').value.trim();
        const autoCheck = document.getElementById('autoCheck').checked;

        const settings = { deepseekToken, pushToken, pushUser, sheetId, autoCheck };
        localStorage.setItem('mark6_api_settings', JSON.stringify(settings));
        showToast('💾 設定已儲存');
    }

    function loadApiSettingsUI() {
        const settings = loadApiSettingsInternal();
        document.getElementById('deepseekToken').value = settings.deepseekToken || '';
        document.getElementById('pushToken').value = settings.pushToken || '';
        document.getElementById('pushUser').value = settings.pushUser || '';
        document.getElementById('sheetId').value = settings.sheetId || '';
        document.getElementById('autoCheck').checked = settings.autoCheck || false;
    }

    // ===== Init =====
    renderHistory();
    generateNumbers();
    loadApiSettingsUI();
</script>

</body>
</html>

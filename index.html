<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mark 6</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Mark 6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#f8f8f5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, system-ui, 'Helvetica Neue', sans-serif;
            background: #f8f8f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: #2c2c2c;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 32px;
            padding: 40px 32px 32px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.03), 0 1px 4px rgba(0, 0, 0, 0.02);
            border: 1px solid #f0f0eb;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 28px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eaeaE5;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 4px;
            color: #1a1a1a;
        }
        .header h1 span { font-weight: 500; }
        .header .badge {
            font-size: 10px;
            font-weight: 400;
            color: #b0b0a8;
            letter-spacing: 1px;
            background: #f4f4f0;
            padding: 2px 12px;
            border-radius: 100px;
        }

        /* 號碼盤 — 骰仔 6 排列 (2行 x 3個) */
        .numbers-display {
            background: #fafaf7;
            border-radius: 24px;
            padding: 32px 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 12px;
            border: 1px solid #efefe9;
            min-height: 180px;
            place-items: center;
        }

        .ball {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: 500;
            background: #ffffff;
            border: 2px solid #e0e0d8;
            color: #2c2c2c;
            transition: all 0.15s ease;
            letter-spacing: 0.5px;
        }
        .ball.placeholder { opacity: 0.2; border-color: #e0e0d8; }
        .ball.red   { border-color: #d32f2f; color: #d32f2f; }
        .ball.blue  { border-color: #1976d2; color: #1976d2; }
        .ball.green { border-color: #388e3c; color: #388e3c; }
        .ball.yellow{ border-color: #f9a825; color: #f9a825; }
        .ball.purple{ border-color: #7b1fa2; color: #7b1fa2; }

        .timestamp {
            font-size: 13px;
            font-weight: 300;
            color: #b0b0a8;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .actions button {
            flex: 1;
            padding: 14px 0;
            border: 1px solid #e0e0d8;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.15s ease;
            background: #ffffff;
            color: #2c2c2c;
        }
        .actions button:hover { background: #f4f4f0; }
        .actions button:active { transform: scale(0.97); }

        .btn-confirm {
            border-color: #d4a86a !important;
            color: #a67c3e !important;
            background: #fdfbf7 !important;
            width: 100%;
        }
        .btn-confirm:hover { background: #f8f4ec !important; }

        .info-badge {
            margin-top: 16px;
            font-size: 13px;
            font-weight: 300;
            color: #c0c0b8;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #2c2c2c;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.3px;
            opacity: 0;
            transition: all 0.35s ease;
            pointer-events: none;
            z-index: 999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            max-width: 90%;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0px);
        }

        /* API Settings — 淨返 Google Sheet */
        .api-section {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid #efefe9;
        }
        .api-section summary {
            font-size: 10px;
            font-weight: 400;
            color: #c0c0b8;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .api-section summary::-webkit-details-marker { display: none; }
        .api-section summary:hover { color: #888; }
        .api-section .arrow {
            font-size: 12px;
            transition: transform 0.2s ease;
        }
        .api-section[open] .arrow { transform: rotate(180deg); }

        .api-body {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .api-body .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .api-body .field label {
            font-size: 10px;
            font-weight: 400;
            color: #b0b0a8;
            letter-spacing: 0.5px;
        }
        .api-body .field input {
            padding: 10px 14px;
            border: 1px solid #e0e0d8;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 300;
            background: #fafaf7;
            color: #2c2c2c;
            outline: none;
            font-family: 'Inter', monospace;
            width: 100%;
        }
        .api-body .field input:focus {
            border-color: #b0b0a8;
            background: #ffffff;
        }
        .api-body .field input::placeholder { color: #c0c0b8; }

        .api-body .btn-save-api {
            padding: 10px 0;
            border: 1px solid #e0e0d8;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 400;
            background: #fafaf7;
            color: #888;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-top: 4px;
        }
        .api-body .btn-save-api:hover {
            background: #f4f4f0;
            color: #2c2c2c;
        }

        .footer {
            margin-top: 16px;
            font-size: 9px;
            font-weight: 300;
            color: #d8d8d0;
            text-align: center;
            letter-spacing: 1px;
        }

        @media (max-width: 420px) {
            .container { padding: 28px 18px 24px; }
            .ball { width: 54px; height: 54px; font-size: 20px; border-width: 2px; }
            .numbers-display { padding: 24px 8px; gap: 8px; }
            .header h1 { font-size: 16px; }
            .actions button { font-size: 15px; }
            .toast { font-size: 12px; padding: 10px 20px; white-space: normal; }
        }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="container">
    <div class="header">
        <h1><span>Mark 6</span></h1>
        <span class="badge">version 1.0</span>
    </div>

    <!-- 號碼盤 — 骰仔 6 排列 -->
    <div class="numbers-display" id="numbersDisplay">
        <span class="ball placeholder">01</span>
        <span class="ball placeholder">02</span>
        <span class="ball placeholder">03</span>
        <span class="ball placeholder">04</span>
        <span class="ball placeholder">05</span>
        <span class="ball placeholder">06</span>
    </div>

    <div class="timestamp" id="timestamp">—</div>

    <!-- 淨返一個按鈕 -->
    <div class="actions">
        <button class="btn-confirm" onclick="confirmPurchase()">確認投注</button>
    </div>

    <div class="info-badge" id="infoBadge"></div>

    <!-- API Settings — 淨返 Google Sheet Web App URL -->
    <details class="api-section" id="apiSection">
        <summary>
            <span>⚙️ API 設定</span>
            <span class="arrow">▾</span>
        </summary>
        <div class="api-body">
            <div class="field">
                <label>Google Sheet Web App URL</label>
                <input type="text" id="webAppUrl" placeholder="https://script.google.com/macros/s/.../exec" />
            </div>
            <button class="btn-save-api" onclick="saveApiSettings()">儲存設定</button>
            <div style="font-size:10px; color:#d0d0c8; text-align:center; margin-top:4px;">
                資料只儲存於瀏覽器
            </div>
        </div>
    </details>

    <div class="footer">local storage</div>
</div>

<script>
    // ============================================================
    // 核心邏輯
    // ============================================================

    let currentNumbers = [];

    // ===== Toast =====
    let toastTimer = null;

    function showToast(message) {
        const el = document.getElementById('toast');
        el.textContent = message;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            el.classList.remove('show');
        }, 1800);
    }

    // ===== 六合彩顏色 =====
    const redSet = new Set([1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46]);
    const blueSet = new Set([3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48]);
    // 其餘為綠波 (5,6,11,16,17,21,22,27,28,32,33,38,39,43,44,49)
    // 黃波: 30-39 (但已有部份喺紅/藍，呢度只係示範，上面 Set 已覆蓋)
    // 紫波: 40-49 (已覆蓋)

    function getBallColor(n) {
        if (redSet.has(n)) return 'red';
        if (blueSet.has(n)) return 'blue';
        // 綠波
        return 'green';
    }

    function formatNumber(n) {
        return String(n).padStart(2, '0');
    }

    // ===== 號碼生成 =====
    function generateRandomNumbers() {
        const pool = [];
        for (let i = 1; i <= 49; i++) pool.push(i);
        const shuffled = pool.sort(() => Math.random() - 0.5);
        return shuffled.slice(0, 6).sort((a, b) => a - b);
    }

    function displayNumbers(main) {
        const container = document.getElementById('numbersDisplay');
        const balls = main.map(n =>
            `<span class="ball ${getBallColor(n)}">${formatNumber(n)}</span>`
        );
        container.innerHTML = balls.join('');
        document.getElementById('timestamp').textContent =
            `🕐 ${new Date().toLocaleString('zh-HK')}`;
    }

    // 每次 load 自動生成
    function generateNumbers() {
        const main = generateRandomNumbers();
        currentNumbers = main;
        displayNumbers(main);
        document.getElementById('infoBadge').textContent = '';
    }

    // ===== 確認投注 (用 webAppUrl 輸入框) =====
    function confirmPurchase() {
        if (currentNumbers.length === 0) {
            showToast('⚠️ 請先生成號碼');
            return;
        }

        const webAppUrl = document.getElementById('webAppUrl').value.trim();
        if (!webAppUrl) {
            showToast('⚠️ 請先喺 API 設定填寫 Web App URL');
            return;
        }

        // Send 去 Google Sheet
        fetch(webAppUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                purchase_date: new Date().toISOString().slice(0, 10),
                numbers: currentNumbers.map(n => formatNumber(n)).join(','),
                status: 'Waiting'
            })
        })
        .then(response => response.text())
        .then(data => {
            if (data === 'Success') {
                showToast('✅ 已記錄：' + currentNumbers.map(n => formatNumber(n)).join(','));
            } else {
                showToast('⚠️ 寫入失敗：' + data);
            }
        })
        .catch(err => {
            showToast('⚠️ 網絡錯誤：' + err.message);
        });

        // 自動生成下一組
        setTimeout(() => generateNumbers(), 500);
    }

    // ===== API Settings =====
    function loadApiSettingsInternal() {
        try {
            const raw = localStorage.getItem('mark6_api_settings');
            if (!raw) return {};
            return JSON.parse(raw);
        } catch (e) { return {}; }
    }

    function saveApiSettings() {
        const webAppUrl = document.getElementById('webAppUrl').value.trim();
        const settings = { webAppUrl };
        localStorage.setItem('mark6_api_settings', JSON.stringify(settings));
        showToast('💾 設定已儲存');
    }

    function loadApiSettingsUI() {
        const settings = loadApiSettingsInternal();
        document.getElementById('webAppUrl').value = settings.webAppUrl || '';
    }

    // ===== Init =====
    generateNumbers();  // <-- 確保一開波有顏色同數字
    loadApiSettingsUI();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎰 六合彩生成器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: #0d0d0d;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景光暈 */
        body::before {
            content: '';
            position: fixed;
            top: -40%;
            left: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(180, 83, 255, 0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            right: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(255, 200, 50, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 32px 24px 28px;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
        }
        .header h1 span {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .badge {
            font-size: 11px;
            font-weight: 600;
            color: #a3a3a3;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 12px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* Mode Toggle */
        .mode-toggle {
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .mode-toggle button {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            background: transparent;
            color: #888;
        }
        .mode-toggle button.active {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            color: #fff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        .mode-toggle button:hover:not(.active) {
            color: #ccc;
        }

        /* 號碼盤 */
        .numbers-display {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 28px;
            padding: 32px 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-height: 110px;
        }

        .ball {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
        }
        .ball.glow-gold {
            background: linear-gradient(145deg, #fbbf24, #d97706);
            box-shadow: 0 4px 28px rgba(251, 191, 36, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        .ball.glow-purple {
            background: linear-gradient(145deg, #a855f7, #7c3aed);
            box-shadow: 0 4px 28px rgba(168, 85, 247, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            width: 48px;
            height: 48px;
            font-size: 18px;
        }
        .ball.placeholder {
            opacity: 0.2;
        }

        .plus-sign {
            font-size: 26px;
            color: #555;
            font-weight: 300;
            margin: 0 2px;
        }

        .timestamp {
            font-size: 12px;
            color: #555;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 0.2px;
        }

        /* 按鈕 */
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .actions button {
            flex: 1;
            padding: 14px 0;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-generate {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0d0d0d;
            box-shadow: 0 4px 24px rgba(251, 191, 36, 0.15);
        }
        .btn-generate:hover {
            transform: scale(0.97);
            box-shadow: 0 6px 32px rgba(251, 191, 36, 0.25);
        }
        .btn-generate:active {
            transform: scale(0.94);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-confirm {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 4px 24px rgba(16, 185, 129, 0.12);
        }
        .btn-confirm:hover {
            transform: scale(0.97);
            box-shadow: 0 6px 32px rgba(16, 185, 129, 0.2);
        }
        .btn-confirm:active {
            transform: scale(0.94);
        }

        /* Token input */
        .token-area {
            margin-top: 14px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: none;
        }
        .token-area label {
            font-size: 11px;
            font-weight: 600;
            color: #666;
            display: block;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .token-area input {
            width: 100%;
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.3);
            color: #eee;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .token-area input::placeholder {
            color: #444;
        }
        .token-area input:focus {
            ring: 2px solid rgba(251, 191, 36, 0.2);
        }

        .info-badge {
            margin-top: 14px;
            font-size: 12px;
            color: #555;
            text-align: center;
            letter-spacing: 0.2px;
        }

        /* 歷史記錄 */
        .history {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }
        .history h3 {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: #aaa;
        }
        .history-item .nums {
            font-family: 'Inter', monospace;
            font-weight: 500;
            color: #ddd;
        }
        .history-item .status {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 100px;
        }
        .status.pending {
            background: rgba(251, 191, 36, 0.12);
            color: #fbbf24;
        }
        .status.win {
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
        }
        .status.lose {
            background: rgba(239, 68, 68, 0.08);
            color: #666;
        }
        .history-empty {
            color: #444;
            font-size: 13px;
            text-align: center;
            padding: 16px 0;
        }

        .footer {
            margin-top: 20px;
            font-size: 10px;
            color: #2a2a2a;
            text-align: center;
            letter-spacing: 0.3px;
        }

        /* Responsive */
        @media (max-width: 420px) {
            .container { padding: 24px 16px 20px; border-radius: 28px; }
            .ball { width: 44px; height: 44px; font-size: 16px; }
            .ball.glow-purple { width: 40px; height: 40px; font-size: 14px; }
            .numbers-display { padding: 24px 10px; gap: 6px; }
            .header h1 { font-size: 19px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>🎰 <span>Mark6</span></h1>
        <span class="badge">v1</span>
    </div>

    <!-- Mode Toggle -->
    <div class="mode-toggle">
        <button id="modeRandom" class="active" onclick="setMode('random')">🎲 隨機</button>
        <button id="modeDeepseek" onclick="setMode('deepseek')">⚡ AI</button>
    </div>

    <!-- Numbers -->
    <div class="numbers-display" id="numbersDisplay">
        <span class="ball placeholder">01</span>
        <span class="ball placeholder">02</span>
        <span class="ball placeholder">03</span>
        <span class="ball placeholder">04</span>
        <span class="ball placeholder">05</span>
        <span class="ball placeholder">06</span>
        <span class="plus-sign">+</span>
        <span class="ball glow-purple placeholder">07</span>
    </div>

    <div class="timestamp" id="timestamp">—</div>

    <!-- Actions -->
    <div class="actions">
        <button class="btn-generate" onclick="generateNumbers()">🔄 生成</button>
        <button class="btn-secondary" onclick="copyNumbers()">📋 複製</button>
    </div>
    <div class="actions">
        <button class="btn-confirm" onclick="confirmPurchase()">✅ 確認購買</button>
    </div>

    <!-- Token -->
    <div class="token-area" id="tokenArea">
        <label>🔑 DeepSeek Token</label>
        <input type="password" id="deepseekToken" placeholder="sk-..." />
    </div>

    <div class="info-badge" id="infoBadge">⚡ 隨機生成 · 免費</div>

    <!-- History -->
    <div class="history">
        <h3>📊 記錄</h3>
        <div id="historyList">
            <div class="history-empty">未有記錄</div>
        </div>
    </div>

    <div class="footer">儲存於本地 · 換機唔跟</div>
</div>

<script>
    // ============================================================
    // 核心邏輯 (同之前一樣，只係改咗 UI)
    // ============================================================

    let currentMode = 'random';
    let currentNumbers = [];
    let currentSpecial = null;
    let history = JSON.parse(localStorage.getItem('mark6_history') || '[]');

    function saveHistory() {
        localStorage.setItem('mark6_history', JSON.stringify(history));
    }

    function generateRandomNumbers() {
        const pool = [];
        for (let i = 1; i <= 49; i++) pool.push(i);
        const shuffled = pool.sort(() => Math.random() - 0.5);
        const main = shuffled.slice(0, 6).sort((a, b) => a - b);
        const special = shuffled[6];
        return { main, special };
    }

    function formatNumber(n) {
        return String(n).padStart(2, '0');
    }

    function displayNumbers(main, special) {
        const container = document.getElementById('numbersDisplay');
        const balls = main.map(n =>
            `<span class="ball glow-gold">${formatNumber(n)}</span>`
        );
        container.innerHTML = `
            ${balls.join('')}
            <span class="plus-sign">+</span>
            <span class="ball glow-purple">${formatNumber(special)}</span>
        `;
        document.getElementById('timestamp').textContent =
            `🕐 ${new Date().toLocaleString('zh-HK')}`;
    }

    function generateNumbers() {
        if (currentMode === 'deepseek') {
            const token = document.getElementById('deepseekToken').value.trim();
            if (!token) {
                // Fallback 隨機
                const { main, special } = generateRandomNumbers();
                currentNumbers = main;
                currentSpecial = special;
                displayNumbers(main, special);
                document.getElementById('infoBadge').textContent = '⚠️ 無 Token，用隨機';
                return;
            }
            // 模擬 AI (實際可改 API)
            const { main, special } = generateRandomNumbers();
            currentNumbers = main;
            currentSpecial = special;
            displayNumbers(main, special);
            document.getElementById('infoBadge').textContent = '🤖 AI 生成 · 已連線';
        } else {
            const { main, special } = generateRandomNumbers();
            currentNumbers = main;
            currentSpecial = special;
            displayNumbers(main, special);
            document.getElementById('infoBadge').textContent = '⚡ 隨機生成 · 免費';
        }
    }

    function copyNumbers() {
        if (currentNumbers.length === 0) { alert('先生成號碼'); return; }
        const text = currentNumbers.map(n => formatNumber(n)).join(',') +
                    ' + ' + formatNumber(currentSpecial);
        navigator.clipboard.writeText(text).then(() => {
            alert('✅ 已複製：' + text);
        }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            alert('✅ 已複製：' + text);
        });
    }

    function confirmPurchase() {
        if (currentNumbers.length === 0) { alert('先生成號碼'); return; }
        const entry = {
            date: new Date().toISOString().slice(0, 10),
            time: new Date().toLocaleTimeString('zh-HK'),
            numbers: currentNumbers.map(n => formatNumber(n)),
            special: formatNumber(currentSpecial),
            status: 'pending',
        };
        history.unshift(entry);
        if (history.length > 50) history.pop();
        saveHistory();
        renderHistory();
        alert('✅ 已記錄：' + entry.numbers.join(',') + ' + ' + entry.special);
    }

    function renderHistory() {
        const container = document.getElementById('historyList');
        if (history.length === 0) {
            container.innerHTML = '<div class="history-empty">未有記錄</div>';
            return;
        }
        const items = history.slice(0, 10).map((entry) => {
            const statusMap = {
                'pending': '<span class="status pending">待開</span>',
                'win': '<span class="status win">🎉 中</span>',
                'lose': '<span class="status lose">✖</span>',
            };
            const statusHtml = statusMap[entry.status] || statusMap['pending'];
            return `
                <div class="history-item">
                    <span>${entry.date}</span>
                    <span class="nums">${entry.numbers.join(',')} + ${entry.special}</span>
                    ${statusHtml}
                </div>
            `;
        });
        container.innerHTML = items.join('');
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('modeRandom').className = mode === 'random' ? 'active' : '';
        document.getElementById('modeDeepseek').className = mode === 'deepseek' ? 'active' : '';
        document.getElementById('tokenArea').style.display = mode === 'deepseek' ? 'block' : 'none';
        document.getElementById('infoBadge').textContent =
            mode === 'random' ? '⚡ 隨機生成 · 免費' : '🤖 AI 模式 · 需 Token';
        generateNumbers();
    }

    // Init
    renderHistory();
    generateNumbers();
</script>

</body>
</html>

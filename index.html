<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎰 六合彩 · 無印</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, 'Helvetica Neue', sans-serif;
            background: #f8f8f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: #2c2c2c;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 32px;
            padding: 40px 32px 32px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.03), 0 1px 4px rgba(0, 0, 0, 0.02);
            border: 1px solid #f0f0eb;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 32px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eaeaE5;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 4px;
            color: #1a1a1a;
        }
        .header h1 span {
            font-weight: 500;
        }
        .header .badge {
            font-size: 10px;
            font-weight: 400;
            color: #b0b0a8;
            letter-spacing: 1px;
            background: #f4f4f0;
            padding: 2px 12px;
            border-radius: 100px;
        }

        /* Mode Toggle */
        .mode-toggle {
            display: flex;
            gap: 4px;
            background: #f4f4f0;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 32px;
        }
        .mode-toggle button {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent;
            color: #888;
        }
        .mode-toggle button.active {
            background: #ffffff;
            color: #1a1a1a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }
        .mode-toggle button:hover:not(.active) {
            color: #444;
        }

        /* 號碼盤 — 無印風格：素、靜 */
        .numbers-display {
            background: #fafaf7;
            border-radius: 24px;
            padding: 32px 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            border: 1px solid #efefe9;
            min-height: 108px;
        }

        .ball {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: 400;
            color: #2c2c2c;
            background: #ffffff;
            border: 1px solid #e0e0d8;
            transition: all 0.15s ease;
            letter-spacing: 0.5px;
        }
        .ball.gold {
            border-color: #d4a86a;
            color: #a67c3e;
            background: #fdfbf7;
        }
        .ball.purple {
            border-color: #b8a8c8;
            color: #7a6a8a;
            background: #faf8fc;
            width: 44px;
            height: 44px;
            font-size: 16px;
        }
        .ball.placeholder {
            opacity: 0.25;
            border-style: dashed;
        }

        .plus-sign {
            font-size: 20px;
            color: #c0c0b8;
            font-weight: 200;
            margin: 0 2px;
        }

        .timestamp {
            font-size: 11px;
            font-weight: 300;
            color: #b0b0a8;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        /* 按鈕 — 簡約，低調 */
        .actions {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .actions button {
            flex: 1;
            padding: 14px 0;
            border: 1px solid #e0e0d8;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.15s ease;
            background: #ffffff;
            color: #2c2c2c;
        }
        .actions button:hover {
            background: #f4f4f0;
        }
        .actions button:active {
            transform: scale(0.97);
        }

        .btn-generate {
            border-color: #2c2c2c !important;
            background: #2c2c2c !important;
            color: #ffffff !important;
        }
        .btn-generate:hover {
            background: #1a1a1a !important;
        }

        .btn-confirm {
            border-color: #d4a86a !important;
            color: #a67c3e !important;
            background: #fdfbf7 !important;
        }
        .btn-confirm:hover {
            background: #f8f4ec !important;
        }

        /* Token area — 極簡 */
        .token-area {
            margin-top: 16px;
            padding: 16px 18px;
            background: #fafaf7;
            border-radius: 16px;
            border: 1px solid #efefe9;
            display: none;
        }
        .token-area label {
            font-size: 10px;
            font-weight: 400;
            color: #b0b0a8;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
        }
        .token-area input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e0e0d8;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 300;
            background: #ffffff;
            color: #2c2c2c;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .token-area input::placeholder {
            color: #c0c0b8;
        }
        .token-area input:focus {
            border-color: #b0b0a8;
        }

        .info-badge {
            margin-top: 16px;
            font-size: 11px;
            font-weight: 300;
            color: #c0c0b8;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* 歷史記錄 — 乾淨 */
        .history {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #efefe9;
        }
        .history h3 {
            font-size: 11px;
            font-weight: 400;
            color: #b0b0a8;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 13px;
            font-weight: 300;
            border-bottom: 1px solid #f4f4f0;
            color: #555;
        }
        .history-item .nums {
            font-family: 'Inter', monospace;
            font-weight: 400;
            color: #2c2c2c;
            letter-spacing: 0.3px;
        }
        .history-item .status {
            font-size: 10px;
            font-weight: 400;
            padding: 2px 14px;
            border-radius: 100px;
            letter-spacing: 0.5px;
        }
        .status.pending {
            background: #f4f4f0;
            color: #888;
        }
        .status.win {
            background: #f4f0e8;
            color: #a67c3e;
        }
        .status.lose {
            background: #f4f4f0;
            color: #c0c0b8;
        }
        .history-empty {
            color: #d0d0c8;
            font-size: 12px;
            font-weight: 300;
            text-align: center;
            padding: 16px 0;
            letter-spacing: 0.5px;
        }

        .footer {
            margin-top: 20px;
            font-size: 9px;
            font-weight: 300;
            color: #d8d8d0;
            text-align: center;
            letter-spacing: 1px;
        }

        @media (max-width: 420px) {
            .container { padding: 28px 18px 24px; }
            .ball { width: 42px; height: 42px; font-size: 15px; }
            .ball.purple { width: 38px; height: 38px; font-size: 13px; }
            .numbers-display { padding: 24px 8px; gap: 6px; }
            .header h1 { font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>🎰 <span>Mark6</span></h1>
        <span class="badge">muji</span>
    </div>

    <!-- Mode Toggle -->
    <div class="mode-toggle">
        <button id="modeRandom" class="active" onclick="setMode('random')">隨機</button>
        <button id="modeDeepseek" onclick="setMode('deepseek')">AI</button>
    </div>

    <!-- Numbers -->
    <div class="numbers-display" id="numbersDisplay">
        <span class="ball placeholder">01</span>
        <span class="ball placeholder">02</span>
        <span class="ball placeholder">03</span>
        <span class="ball placeholder">04</span>
        <span class="ball placeholder">05</span>
        <span class="ball placeholder">06</span>
        <span class="plus-sign">+</span>
        <span class="ball purple placeholder">07</span>
    </div>

    <div class="timestamp" id="timestamp">—</div>

    <!-- Actions -->
    <div class="actions">
        <button class="btn-generate" onclick="generateNumbers()">生成</button>
        <button onclick="copyNumbers()">複製</button>
    </div>
    <div class="actions">
        <button class="btn-confirm" onclick="confirmPurchase()">確認購買</button>
    </div>

    <!-- Token -->
    <div class="token-area" id="tokenArea">
        <label>DeepSeek Token</label>
        <input type="password" id="deepseekToken" placeholder="sk-..." />
    </div>

    <div class="info-badge" id="infoBadge">隨機生成</div>

    <!-- History -->
    <div class="history">
        <h3>記錄</h3>
        <div id="historyList">
            <div class="history-empty">未有記錄</div>
        </div>
    </div>

    <div class="footer">local storage</div>
</div>

<script>
    // ============================================================
    // 核心邏輯 (同之前一樣)
    // ============================================================

    let currentMode = 'random';
    let currentNumbers = [];
    let currentSpecial = null;
    let history = JSON.parse(localStorage.getItem('mark6_history') || '[]');

    function saveHistory() {
        localStorage.setItem('mark6_history', JSON.stringify(history));
    }

    function generateRandomNumbers() {
        const pool = [];
        for (let i = 1; i <= 49; i++) pool.push(i);
        const shuffled = pool.sort(() => Math.random() - 0.5);
        const main = shuffled.slice(0, 6).sort((a, b) => a - b);
        const special = shuffled[6];
        return { main, special };
    }

    function formatNumber(n) {
        return String(n).padStart(2, '0');
    }

    function displayNumbers(main, special) {
        const container = document.getElementById('numbersDisplay');
        const balls = main.map(n =>
            `<span class="ball gold">${formatNumber(n)}</span>`
        );
        container.innerHTML = `
            ${balls.join('')}
            <span class="plus-sign">+</span>
            <span class="ball purple">${formatNumber(special)}</span>
        `;
        document.getElementById('timestamp').textContent =
            `🕐 ${new Date().toLocaleString('zh-HK')}`;
    }

    function generateNumbers() {
        if (currentMode === 'deepseek') {
            const token = document.getElementById('deepseekToken').value.trim();
            if (!token) {
                const { main, special } = generateRandomNumbers();
                currentNumbers = main;
                currentSpecial = special;
                displayNumbers(main, special);
                document.getElementById('infoBadge').textContent = '⚠️ 無 Token，用隨機';
                return;
            }
            const { main, special } = generateRandomNumbers();
            currentNumbers = main;
            currentSpecial = special;
            displayNumbers(main, special);
            document.getElementById('infoBadge').textContent = '🤖 AI 生成';
        } else {
            const { main, special } = generateRandomNumbers();
            currentNumbers = main;
            currentSpecial = special;
            displayNumbers(main, special);
            document.getElementById('infoBadge').textContent = '隨機生成';
        }
    }

    function copyNumbers() {
        if (currentNumbers.length === 0) { alert('先生成號碼'); return; }
        const text = currentNumbers.map(n => formatNumber(n)).join(',') +
                    ' + ' + formatNumber(currentSpecial);
        navigator.clipboard.writeText(text).then(() => {
            alert('✅ 已複製：' + text);
        }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            alert('✅ 已複製：' + text);
        });
    }

    function confirmPurchase() {
        if (currentNumbers.length === 0) { alert('先生成號碼'); return; }
        const entry = {
            date: new Date().toISOString().slice(0, 10),
            time: new Date().toLocaleTimeString('zh-HK'),
            numbers: currentNumbers.map(n => formatNumber(n)),
            special: formatNumber(currentSpecial),
            status: 'pending',
        };
        history.unshift(entry);
        if (history.length > 50) history.pop();
        saveHistory();
        renderHistory();
        alert('✅ 已記錄：' + entry.numbers.join(',') + ' + ' + entry.special);
    }

    function renderHistory() {
        const container = document.getElementById('historyList');
        if (history.length === 0) {
            container.innerHTML = '<div class="history-empty">未有記錄</div>';
            return;
        }
        const items = history.slice(0, 10).map((entry) => {
            const statusMap = {
                'pending': '<span class="status pending">待開</span>',
                'win': '<span class="status win">中</span>',
                'lose': '<span class="status lose">✖</span>',
            };
            const statusHtml = statusMap[entry.status] || statusMap['pending'];
            return `
                <div class="history-item">
                    <span>${entry.date}</span>
                    <span class="nums">${entry.numbers.join(',')} + ${entry.special}</span>
                    ${statusHtml}
                </div>
            `;
        });
        container.innerHTML = items.join('');
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('modeRandom').className = mode === 'random' ? 'active' : '';
        document.getElementById('modeDeepseek').className = mode === 'deepseek' ? 'active' : '';
        document.getElementById('tokenArea').style.display = mode === 'deepseek' ? 'block' : 'none';
        document.getElementById('infoBadge').textContent =
            mode === 'random' ? '隨機生成' : 'AI 模式 · 需 Token';
        generateNumbers();
    }

    // Init
    renderHistory();
    generateNumbers();
</script>

</body>
</html>

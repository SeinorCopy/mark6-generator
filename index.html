<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎰 六合彩 · 無印</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, 'Helvetica Neue', sans-serif;
            background: #f8f8f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: #2c2c2c;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 32px;
            padding: 40px 32px 32px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.03), 0 1px 4px rgba(0, 0, 0, 0.02);
            border: 1px solid #f0f0eb;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 28px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eaeaE5;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 4px;
            color: #1a1a1a;
        }
        .header h1 span { font-weight: 500; }
        .header .badge {
            font-size: 10px;
            font-weight: 400;
            color: #b0b0a8;
            letter-spacing: 1px;
            background: #f4f4f0;
            padding: 2px 12px;
            border-radius: 100px;
        }

        /* Mode Toggle */
        .mode-toggle {
            display: flex;
            gap: 4px;
            background: #f4f4f0;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 28px;
        }
        .mode-toggle button {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent;
            color: #888;
        }
        .mode-toggle button.active {
            background: #ffffff;
            color: #1a1a1a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }
        .mode-toggle button:hover:not(.active) { color: #444; }

        /* 號碼盤 */
        .numbers-display {
            background: #fafaf7;
            border-radius: 24px;
            padding: 32px 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            border: 1px solid #efefe9;
            min-height: 108px;
        }

        /* 六合彩真實配色 — 全部空心 */
        .ball {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: 500;
            background: #ffffff;
            border: 3px solid #e0e0d8;
            color: #2c2c2c;
            transition: all 0.15s ease;
            letter-spacing: 0.5px;
        }
        .ball.placeholder {
            opacity: 0.2;
            border-color: #e0e0d8;
        }

        /* 空心顏色 class */
        .ball.red   { border-color: #d32f2f; color: #d32f2f; }
        .ball.blue  { border-color: #1976d2; color: #1976d2; }
        .ball.green { border-color: #388e3c; color: #388e3c; }
        .ball.yellow{ border-color: #f9a825; color: #f9a825; }
        .ball.purple{ border-color: #7b1fa2; color: #7b1fa2; }

        .plus-sign {
            font-size: 22px;
            color: #c0c0b8;
            font-weight: 200;
            margin: 0 2px;
        }

        .timestamp {
            font-size: 13px;
            font-weight: 300;
            color: #b0b0a8;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        /* 按鈕 */
        .actions {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .actions button {
            flex: 1;
            padding: 14px 0;
            border: 1px solid #e0e0d8;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.15s ease;
            background: #ffffff;
            color: #2c2c2c;
        }
        .actions button:hover { background: #f4f4f0; }
        .actions button:active { transform: scale(0.97); }

        .btn-generate {
            border-color: #2c2c2c !important;
            background: #2c2c2c !important;
            color: #ffffff !important;
        }
        .btn-generate:hover { background: #1a1a1a !important; }

        .btn-confirm {
            border-color: #d4a86a !important;
            color: #a67c3e !important;
            background: #fdfbf7 !important;
        }
        .btn-confirm:hover { background: #f8f4ec !important; }

        .info-badge {
            margin-top: 16px;
            font-size: 13px;
            font-weight: 300;
            color: #c0c0b8;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* ===== 歷史記錄 ===== */
        .history {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #efefe9;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .history h3 {
            font-size: 11px;
            font-weight: 400;
            color: #b0b0a8;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 14px;
            font-weight: 300;
            border-bottom: 1px solid #f4f4f0;
            color: #555;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* 記錄入面嘅細波波 */
        .history-balls {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }
        .h-ball {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 11px;
            font-weight: 500;
            background: #ffffff;
            border: 2.5px solid #e0e0d8;
            color: #2c2c2c;
        }
        .h-ball.red   { border-color: #d32f2f; color: #d32f2f; }
        .h-ball.blue  { border-color: #1976d2; color: #1976d2; }
        .h-ball.green { border-color: #388e3c; color: #388e3c; }
        .h-ball.yellow{ border-color: #f9a825; color: #f9a825; }
        .h-ball.purple{ border-color: #7b1fa2; color: #7b1fa2; }
        .h-ball.special {
            border-width: 2.5px;
            border-style: solid;
        }
        .h-plus {
            font-size: 12px;
            color: #c0c0b8;
            margin: 0 1px;
        }

        .history-item .h-date {
            font-size: 12px;
            color: #b0b0a8;
            min-width: 60px;
        }

        .history-actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .history-actions button {
            background: none;
            border: 1px solid #e0e0d8;
            border-radius: 6px;
            padding: 2px 10px;
            font-size: 10px;
            cursor: pointer;
            color: #888;
            transition: all 0.15s ease;
        }
        .history-actions .btn-delete {
            border-color: #f0e0e0;
            color: #ccc;
        }
        .history-actions .btn-delete:hover {
            background: #fdf5f5;
            color: #d32f2f;
            border-color: #f0c8c8;
        }

        .history-empty {
            color: #d0d0c8;
            font-size: 12px;
            font-weight: 300;
            text-align: center;
            padding: 16px 0;
            letter-spacing: 0.5px;
        }

        /* ===== API Settings (放最底) ===== */
        .api-section {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid #efefe9;
        }
        .api-section summary {
            font-size: 10px;
            font-weight: 400;
            color: #c0c0b8;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .api-section summary::-webkit-details-marker {
            display: none;
        }
        .api-section summary:hover {
            color: #888;
        }
        .api-section .arrow {
            font-size: 12px;
            transition: transform 0.2s ease;
        }
        .api-section[open] .arrow {
            transform: rotate(180deg);
        }

        .api-body {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .api-body .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .api-body .field label {
            font-size: 10px;
            font-weight: 400;
            color: #b0b0a8;
            letter-spacing: 0.5px;
        }
        .api-body .field input {
            padding: 10px 14px;
            border: 1px solid #e0e0d8;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 300;
            background: #fafaf7;
            color: #2c2c2c;
            outline: none;
            font-family: 'Inter', monospace;
            width: 100%;
        }
        .api-body .field input:focus {
            border-color: #b0b0a8;
            background: #ffffff;
        }
        .api-body .field input::placeholder {
            color: #c0c0b8;
        }

        .api-body .field-row {
            display: flex;
            gap: 10px;
        }
        .api-body .field-row .field {
            flex: 1;
        }

        .api-body .btn-save-api {
            padding: 10px 0;
            border: 1px solid #e0e0d8;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 400;
            background: #fafaf7;
            color: #888;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-top: 4px;
        }
        .api-body .btn-save-api:hover {
            background: #f4f4f0;
            color: #2c2c2c;
        }

        .footer {
            margin-top: 16px;
            font-size: 9px;
            font-weight: 300;
            color: #d8d8d0;
            text-align: center;
            letter-spacing: 1px;
        }

        /* Responsive */
        @media (max-width: 420px) {
            .container { padding: 28px 18px 24px; }
            .ball { width: 44px; height: 44px; font-size: 17px; }
            .numbers-display { padding: 24px 8px; gap: 6px; }
            .header h1 { font-size: 16px; }
            .actions button { font-size: 15px; }
            .history-item { font-size: 13px; }
            .h-ball { width: 24px; height: 24px; font-size: 10px; border-width: 2px; }
            .api-body .field-row { flex-direction: column; gap: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>🎰 <span>Mark6</span></h1>
        <span class="badge">muji</span>
    </div>

    <!-- Mode Toggle -->
    <div class="mode-toggle">
        <button id="modeRandom" class="active" onclick="setMode('random')">隨機</button>
        <button id="modeDeepseek" onclick="setMode('deepseek')">AI</button>
    </div>

    <!-- Numbers -->
    <div class="numbers-display" id="numbersDisplay">
        <span class="ball placeholder">01</span>
        <span class="ball placeholder">02</span>
        <span class="ball placeholder">03</span>
        <span class="ball placeholder">04</span>
        <span class="ball placeholder">05</span>
        <span class="ball placeholder">06</span>
        <span class="plus-sign">+</span>
        <span class="ball placeholder">07</span>
    </div>

    <div class="timestamp" id="timestamp">—</div>

    <!-- Actions -->
    <div class="actions">
        <button class="btn-generate" onclick="generateNumbers()">生成</button>
        <button onclick="copyNumbers()">複製</button>
    </div>
    <div class="actions">
        <button class="btn-confirm" onclick="confirmPurchase()">確認購買</button>
    </div>

    <div class="info-badge" id="infoBadge">隨機生成</div>

    <!-- ===== History ===== -->
    <div class="history">
        <div class="history-header">
            <h3>記錄</h3>
            <span style="font-size:10px; color:#ccc;" id="historyCount">0 筆</span>
        </div>
        <div id="historyList">
            <div class="history-empty">未有記錄</div>
        </div>
    </div>

    <!-- ===== API Settings (放最底) ===== -->
    <details class="api-section" id="apiSection">
        <summary>
            <span>⚙️ API 設定</span>
            <span class="arrow">▾</span>
        </summary>
        <div class="api-body">
            <!-- Google Sheet -->
            <div class="field">
                <label>Google Sheets API Credentials (JSON)</label>
                <input type="text" id="gsheetCred" placeholder='{"type":"service_account",...}' />
            </div>
            <div class="field">
                <label>Google Sheet ID</label>
                <input type="text" id="sheetId" placeholder="1A2B3C4D5E..." />
            </div>

            <!-- Pushover -->
            <div class="field-row">
                <div class="field">
                    <label>Pushover Token</label>
                    <input type="password" id="pushToken" placeholder="au..."/>
                </div>
                <div class="field">
                    <label>Pushover User Key</label>
                    <input type="password" id="pushUser" placeholder="u..." />
                </div>
            </div>

            <button class="btn-save-api" onclick="saveApiSettings()">💾 儲存設定</button>
            <div style="font-size:10px; color:#d0d0c8; text-align:center; margin-top:4px;">
                資料只儲存於瀏覽器 local storage
            </div>
        </div>
    </details>

    <div class="footer">local storage</div>
</div>

<script>
    // ============================================================
    // 核心邏輯
    // ============================================================

    let currentMode = 'random';
    let currentNumbers = [];
    let currentSpecial = null;
    let history = JSON.parse(localStorage.getItem('mark6_history') || '[]');

    // ===== 六合彩顏色對照 (馬會真實配色) =====
    // 紅波: 1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46
    // 藍波: 3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48
    // 綠波: 5,6,11,16,17,21,22,27,28,32,33,38,39,43,44,49
    const redSet = new Set([1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46]);
    const blueSet = new Set([3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48]);
    // 其餘為綠波

    function getBallColor(n) {
        if (redSet.has(n)) return 'red';
        if (blueSet.has(n)) return 'blue';
        return 'green';
    }

    // ===== 號碼生成 =====
    function generateRandomNumbers() {
        const pool = [];
        for (let i = 1; i <= 49; i++) pool.push(i);
        const shuffled = pool.sort(() => Math.random() - 0.5);
        const main = shuffled.slice(0, 6).sort((a, b) => a - b);
        const special = shuffled[6];
        return { main, special };
    }

    function formatNumber(n) {
        return String(n).padStart(2, '0');
    }

    function displayNumbers(main, special) {
        const container = document.getElementById('numbersDisplay');
        const balls = main.map(n =>
            `<span class="ball ${getBallColor(n)}">${formatNumber(n)}</span>`
        );
        container.innerHTML = `
            ${balls.join('')}
            <span class="plus-sign">+</span>
            <span class="ball ${getBallColor(special)}">${formatNumber(special)}</span>
        `;
        document.getElementById('timestamp').textContent =
            `🕐 ${new Date().toLocaleString('zh-HK')}`;
    }

    function generateNumbers() {
        if (currentMode === 'deepseek') {
            // 現階段 fallback 隨機，之後可駁 DeepSeek API
            const { main, special } = generateRandomNumbers();
            currentNumbers = main;
            currentSpecial = special;
            displayNumbers(main, special);
            document.getElementById('infoBadge').textContent = '🤖 AI 模式 (示範)';
        } else {
            const { main, special } = generateRandomNumbers();
            currentNumbers = main;
            currentSpecial = special;
            displayNumbers(main, special);
            document.getElementById('infoBadge').textContent = '隨機生成';
        }
    }

    function copyNumbers() {
        if (currentNumbers.length === 0) { alert('先生成號碼'); return; }
        const text = currentNumbers.map(n => formatNumber(n)).join(',') +
                    ' + ' + formatNumber(currentSpecial);
        navigator.clipboard.writeText(text).then(() => {
            alert('✅ 已複製：' + text);
        }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            alert('✅ 已複製：' + text);
        });
    }

    function confirmPurchase() {
        if (currentNumbers.length === 0) { alert('先生成號碼'); return; }
        const entry = {
            id: Date.now(),
            date: new Date().toISOString().slice(0, 10),
            numbers: currentNumbers.slice(),
            special: currentSpecial,
            status: 'pending', // 只用作顯示，唔再俾人改
        };
        history.unshift(entry);
        if (history.length > 100) history.pop();
        saveHistory();
        renderHistory();
        alert('✅ 已記錄：' + currentNumbers.map(n => formatNumber(n)).join(',') + ' + ' + formatNumber(currentSpecial));
    }

    // ===== 歷史記錄 =====
    function saveHistory() {
        localStorage.setItem('mark6_history', JSON.stringify(history));
        updateHistoryCount();
    }

    function updateHistoryCount() {
        document.getElementById('historyCount').textContent = history.length + ' 筆';
    }

    function deleteEntry(id) {
        if (!confirm('刪除此記錄？')) return;
        history = history.filter(h => h.id !== id);
        saveHistory();
        renderHistory();
    }

    function renderHistory() {
        const container = document.getElementById('historyList');
        if (history.length === 0) {
            container.innerHTML = '<div class="history-empty">未有記錄</div>';
            return;
        }

        const items = history.slice(0, 50).map((entry) => {
            // 生成細波波 HTML
            const ballsHtml = entry.numbers.map(n =>
                `<span class="h-ball ${getBallColor(n)}">${formatNumber(n)}</span>`
            ).join('');
            const specialHtml = `<span class="h-ball ${getBallColor(entry.special)}">${formatNumber(entry.special)}</span>`;

            return `
                <div class="history-item">
                    <span class="h-date">${entry.date}</span>
                    <span class="history-balls">
                        ${ballsHtml}
                        <span class="h-plus">+</span>
                        ${specialHtml}
                    </span>
                    <div class="history-actions">
                        <button class="btn-delete" onclick="deleteEntry(${entry.id})">✕</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = items.join('');
        updateHistoryCount();
    }

    // ===== Mode =====
    function setMode(mode) {
        currentMode = mode;
        document.getElementById('modeRandom').className = mode === 'random' ? 'active' : '';
        document.getElementById('modeDeepseek').className = mode === 'deepseek' ? 'active' : '';
        document.getElementById('infoBadge').textContent =
            mode === 'random' ? '隨機生成' : 'AI 模式 (示範)';
        generateNumbers();
    }

    // ===== API Settings (儲存) =====
    function saveApiSettings() {
        const gsheetCred = document.getElementById('gsheetCred').value.trim();
        const sheetId = document.getElementById('sheetId').value.trim();
        const pushToken = document.getElementById('pushToken').value.trim();
        const pushUser = document.getElementById('pushUser').value.trim();

        const settings = { gsheetCred, sheetId, pushToken, pushUser };
        localStorage.setItem('mark6_api_settings', JSON.stringify(settings));
        alert('✅ API 設定已儲存 (只存於瀏覽器)');
    }

    function loadApiSettings() {
        try {
            const raw = localStorage.getItem('mark6_api_settings');
            if (!raw) return;
            const settings = JSON.parse(raw);
            document.getElementById('gsheetCred').value = settings.gsheetCred || '';
            document.getElementById('sheetId').value = settings.sheetId || '';
            document.getElementById('pushToken').value = settings.pushToken || '';
            document.getElementById('pushUser').value = settings.pushUser || '';
        } catch (e) { /* ignore */ }
    }

    // ===== Init =====
    renderHistory();
    generateNumbers();
    loadApiSettings();
</script>

</body>
</html>
